name: Genera miniature ottimizzate
on:
  push:
    branches:
      - ottimizzazione-immagini-e-salvataggio
    paths:
      - thumb-manifest.json
      - scripts/build-thumbnails.py
      - .github/workflows/build-thumbnails.yml
permissions:
  contents: write
jobs:
  thumbnails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pillow>=11,<13'
      - run: python scripts/build-thumbnails.py
      - name: Salva miniature nel ramo di sviluppo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add thumbs
          if ! git diff --cached --quiet; then
            git commit -m "Genera miniature WebP per le immagini esistenti"
            git push
          fi
