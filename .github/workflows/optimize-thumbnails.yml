name: Optimize existing product thumbnails
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-thumbnails.yml'
permissions:
  contents: write
concurrency:
  group: cd-thumbnail-backfill
  cancel-in-progress: false
jobs:
  thumbnails:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/backfill-thumbnails.py
      - name: Save generated thumbnails
        run: |
          git add thumbs/
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate lightweight catalog thumbnails"
          git pull --rebase origin main
          git push origin HEAD:main
