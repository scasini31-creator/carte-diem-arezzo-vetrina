<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b11">
<title>Scheda Mancolista — CARTE DIEM AREZZO</title>
<link rel="icon" href="icona-192.png">
<style>
:root{color-scheme:dark;font-family:Arial,Helvetica,sans-serif;background:#090b11;color:#f5f2eb}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:linear-gradient(140deg,#090b11,#11131c)}
header{padding:16px max(16px,env(safe-area-inset-right)) 16px max(16px,env(safe-area-inset-left));border-bottom:1px solid #a88350;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#101116}
.brand{color:#f6e9d3;text-decoration:none;font:bold clamp(15px,3.5vw,23px) Georgia,serif;letter-spacing:.07em}.brand span{color:#d8ad6f}
.back{border:1px solid #bd9257;border-radius:9px;padding:10px 12px;color:#f4d6a7;text-decoration:none;font-size:14px;flex:none}
main{width:min(96%,930px);margin:25px auto 40px;padding:clamp(14px,3vw,28px);border:1px solid #997447;border-radius:16px;background:#10131b}
.eyebrow{margin:0 0 18px;color:#d7b77e;letter-spacing:.11em;font-weight:bold;font-size:13px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
.photo{width:100%;background:#000;border:1px solid #29252a;border-radius:10px;overflow:hidden;min-height:200px;display:flex;align-items:center;justify-content:center}
.photo img{display:block;max-width:100%;max-height:65dvh;width:100%;height:auto;object-fit:contain}
h1{font:normal clamp(25px,4vw,38px)/1.22 Georgia,serif;color:#f7d48e;margin:0 0 21px;overflow-wrap:anywhere}
.info{min-width:0}
.field{margin:0 0 20px;line-height:1.5;overflow-wrap:anywhere}
.label{display:block;color:#d9b67b;font-size:12px;font-weight:bold;letter-spacing:.09em;text-transform:uppercase;margin:0 0 4px}
.value{white-space:pre-wrap}
.conditions{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.conditions span{border:1px solid #9f7e53;padding:5px 9px;border-radius:6px;background:#171c26;color:#fff}
.missing{max-width:700px;margin:auto;padding:30px 10px;text-align:center;line-height:1.5}
[hidden]{display:none!important}
@media(max-width:600px){header{padding:12px 14px}.layout{grid-template-columns:1fr;gap:16px}.photo img{max-height:45dvh}main{margin:14px auto}.eyebrow{margin-bottom:13px}}
</style>
</head>
<body>
<header><a class="brand" href="index.html">CARTE DIEM <span>AREZZO</span></a><a class="back" href="index.html#cd-mancolista">← Mancolista</a></header>
<main>
 <p class="eyebrow">LA NOSTRA MANCOLISTA</p>
 <p id="status" class="missing" role="status">Caricamento della scheda…</p>
 <section id="record" class="layout" hidden aria-label="Scheda articolo">
  <div id="photo" class="photo"></div>
  <div class="info"><h1 id="name"></h1><div id="fields"></div></div>
 </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js?v=2"></script>
<script>
(async function(){
  'use strict';
  const status=document.getElementById('status');
  const id=new URLSearchParams(location.search).get('id');
  if(!id||!/^[0-9]+$/.test(id)){status.textContent='Articolo non disponibile nella Mancolista.';return;}
  function row(label,value,container){
    if(!value)return;
    const section=document.createElement('div');section.className='field';
    const caption=document.createElement('span');caption.className='label';caption.textContent=label;
    const content=document.createElement('div');content.className='value';content.textContent=value;
    section.append(caption,content);container.appendChild(section);
  }
  try{
    const {data,error}=await sb.from('mancolista')
      .select('id,nome,espansione,immagine_url,lingua,condizioni,descrizione')
      .eq('id',id).maybeSingle();
    if(error)throw error;
    if(!data){status.textContent='Questo articolo non è più presente nella Mancolista.';return;}
    document.title=(data.nome||'Articolo')+' — Mancolista Carte Diem';
    document.getElementById('name').textContent=data.nome||'Articolo';
    const photo=document.getElementById('photo');
    if(data.immagine_url){const img=document.createElement('img');img.src=data.immagine_url;img.alt=data.nome||'Articolo';photo.appendChild(img);}else photo.hidden=true;
    const fields=document.getElementById('fields');
    row('Espansione',data.espansione,fields);
    row('Lingua',data.lingua,fields);
    const conditions=String(data.condizioni||'').split(';').map(x=>x.trim()).filter(Boolean);
    if(conditions.length){
      const block=document.createElement('div');block.className='field';
      const label=document.createElement('span');label.className='label';label.textContent='Condizioni';
      const list=document.createElement('div');list.className='conditions';
      conditions.forEach(x=>{const line=document.createElement('span');line.textContent=x;list.appendChild(line);});
      block.append(label,list);fields.appendChild(block);
    }
    row('Descrizione',data.descrizione,fields);
    status.hidden=true;document.getElementById('record').hidden=false;
  }catch(error){console.error('Scheda Mancolista',error);status.textContent='Impossibile caricare la scheda. Riprova ad aprirla dalla Mancolista.';}
})();
</script>
</body></html>
